<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnşaat ERP - Gelir/Gider Ekle</title>
    <!-- Bootstrap 5.3 CSS Kütüphanesi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            overflow-x: hidden; 
        }
        /* Sol Menü (Sidebar) - HER ZAMAN GÖRÜNÜR */
        .sidebar {
            width: 260px; /* Genişliği sabitledik */
            height: 100vh;
            background-color: #212529;
            padding-top: 30px;
            color: white;
            flex-shrink: 0; /* Daralmasını engelledik */
        }
        .sidebar .brand {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #f8f9fa;
            letter-spacing: 1px;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 20px;
            display: block;
            border-radius: 8px;
            margin: 5px 15px;
            font-weight: 500;
            transition: 0.3s ease;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #0d6efd;
            color: white;
        }
        /* Sağ İçerik Alanı */
        .main-content {
            padding: 40px;
            height: 100vh;
            overflow-y: auto;
            width: 100%;
        }
        .card { 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.05); 
        }
    </style>
</head>
<body>

<div class="d-flex">
    
    <!-- 1. SÜTUN: Sol Menü (Sabit Genişlik) -->
    <div class="sidebar">
        <div class="brand">🏗️ ÖZDOĞAN İNŞAAT</div>
        
        <a href="/" class="active">💸 Gelir/Gider Ekle</a>
        <a href="/islemler">📊 Finansal Raporlar</a>
        <a href="/projeler">🏗️ Şantiyeler</a>
        <a href="/musteriler">👥 Müşteriler</a>
        <a href="/logout" class="text-danger mt-4" style="border-top: 1px solid #444; padding-top: 15px;">🚪 Çıkış Yap</a>
    </div>

    <!-- 2. SÜTUN: Sağ İçerik Alanı -->
    <div class="main-content flex-grow-1">
        <div class="container" style="max-width: 900px;">
            <h2 class="mb-4 text-primary fw-bold">Yeni Finansal İşlem Ekle</h2>

            <div class="card p-4 p-md-5">
                <form action="/ekle" method="POST">
                    
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label fw-bold text-secondary">İlgili Şantiye (Opsiyonel):</label>
                            <select name="project_id" class="form-select border-primary-subtle">
                                <option value="">-- Şantiye Seçin --</option>
                                {% for proje in projeler %}
                                    <option value="{{ proje[0] }}">{{ proje[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-secondary">İlgili Müşteri (Opsiyonel):</label>
                            <select name="customer_id" class="form-select border-primary-subtle">
                                <option value="">-- Müşteri Seçin --</option>
                                {% for musteri in musteriler %}
                                    <option value="{{ musteri[0] }}">{{ musteri[1] }} {{ musteri[2] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <hr class="text-muted mb-4">

                    <div class="row mb-3">
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label class="form-label fw-medium">İşlem Tarihi:</label>
                            <input type="date" name="tarih" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3 mb-md-0">
                            <label class="form-label fw-medium">İşlem Tipi:</label>
                            <select name="islem_tipi" class="form-select">
                                <option value="GIDER">Gider (Harcama)</option>
                                <option value="GELIR">Gelir (Tahsilat)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Para Birimi:</label>
                            <select name="para_birimi" class="form-select">
                                <option value="TRY">TL</option>
                                <option value="USD">Dolar</option>
                                <option value="EUR">Euro</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-8 mb-3 mb-md-0">
                            <label class="form-label fw-medium">Kategori (Açıklama):</label>
                            <input type="text" name="kategori" class="form-control" placeholder="Örn: Çimento, İşçilik, Daire Satışı" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Tutar:</label>
                            <div class="input-group">
                                <input type="number" step="0.01" name="tutar" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">İşlemi Kaydet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
