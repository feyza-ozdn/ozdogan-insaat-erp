<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özdoğan İnşaat - Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); background: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4 fw-bold text-dark">🏢 ÖZDOĞAN İNŞAAT</h3>
        
        {% if hata %}
            <div class="alert alert-danger py-2 text-center" style="font-size: 14px;">{{ hata }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary fw-medium">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" placeholder="feyza" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary fw-medium">Şifre</label>
                <input type="password" name="password" class="form-control" placeholder="****" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
